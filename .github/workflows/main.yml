name: Project Wintra Daily Report

on:
  schedule:
    # 01:30 UTC is exactly 08:30 WIB (Jakarta Time)
    - cron: '30 1 * * 1-5'
  workflow_dispatch: # This adds a "Run Now" button in GitHub for testing

jobs:
  run-wintra:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Execute Wintra Engine
        env:
          # This connects your GitHub Secrets to the Python script
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python wintra_engine.py